<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Властивості елементу</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <p><a href="/index.html">На головну</a></p>

    <button class="magic-btn js-magic-btn">
      Вау!
      <span class="icon">🧙‍♂️</span>
    </button>

    <section class="hero">
      <h1 class="hero__title">Зображення котика</h1>
      <img
        class="hero__image"
        src="https://images.pexels.com/photos/57416/cat-sweet-kitty-animals-57416.jpeg?auto=compress&cs=tinysrgb&dpr=2&w=480"
        width="320"
      />
    </section>

    <hr />

    <input type="text" class="input js-input" />

    <div class="actions js-actions">
      <button type="button" data-action="add">Створити</button>
      <button type="button" data-action="remove">Видалити</button>
      <button type="button" data-action="edit" data-x="y">Редагувати</button>
    </div>

    <script src="./js/02-properties.js" type="module"></script>
