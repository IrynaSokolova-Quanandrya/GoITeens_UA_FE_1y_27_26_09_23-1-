<!DOCTYPE html>
<html lang="uk">
	<head>
		<meta charset="UTF-8" />
		<title>Intersection Observer Demo</title>
		<style>
			body {
				font-family: sans-serif;
				margin: 0;
				padding: 0;
			}
			ul {
				list-style: none;
			}
			img {
				margin-bottom: 20px;
				opacity: 0;
				transform: translateY(50px);
				transition: all 0.8s ease-out;
			}
			img.visible {
				opacity: 1;
				transform: translateY(0);
			}
		</style>
	</head>
	<body>
		<ul>
			<li><img width="300" src="./images/BG.jpg" /></li>
			<li><img width="300" src="./images/bg_1.jpg" /></li>
			<li><img width="300" src="./images/cup-in-the-box.jpeg" /></li>
			<li><img width="300" src="./images/girl.png" /></li>
			<li><img width="300" src="./images/roza_kub_2-750x750.jpg" /></li>
			<li><img width="300" src="./images/scene.webp" /></li>
		</ul>

		<script src="index.js"></script>
	</body>
</html>
